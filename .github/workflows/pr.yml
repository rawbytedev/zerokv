name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pr-title-lint:
      runs-on: ubuntu-latest
      if: github.event_name == 'pull_request'
      steps:
        - uses: amannn/action-semantic-pull-request@v5
          env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
              types: |
                fix
                feat
                docs
                test
                chore
              requireScope: false 